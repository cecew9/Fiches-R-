<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Mes fiches</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap');
  :root{
    --paper:#EFEDE4; --ink:#2A2622; --card:#F2E9D3; --red:#A6413B; --muted:#847C6E; --green:#3B6E3B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
  .display{font-family:'Fraunces',serif;font-weight:600;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:420px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
  input,textarea{font-family:inherit;border:none;outline:none;background:transparent;width:100%;}
  .btn-primary{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-outline{border:1px dashed var(--muted);border-radius:14px;padding:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
  .card-row{background:white;border-radius:12px;padding:16px;display:flex;align-items:center;gap:10px;}
  .small{font-size:13px;color:var(--muted);}
  .deck-tile{background:white;border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;}
  .deck-tile:active{transform:scale(0.98);}
  .toggle{flex:1;padding:10px;border-radius:10px;text-align:center;font-size:14px;}
  .field-box{background:white;border-radius:10px;padding:10px;display:flex;gap:8px;align-items:flex-start;}
  .icon-btn{padding:8px;}
  .flip-outer{width:100%;max-width:340px;height:340px;perspective:1200px;margin:0 auto;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;cursor:pointer;}
  .flip-inner.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;border-radius:18px;padding:24px;backface-visibility:hidden;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .face-front{background:var(--card);}
  .face-back{background:white;transform:rotateY(180deg);overflow:auto;}
  .rule{height:1px;background:var(--red);opacity:.5;margin-bottom:16px;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- Stockage ----------
const STORAGE_KEY = "mes-fiches-data-v1";
function loadData(){
  let d = {decks:[], cards:[], dailyLimit:20, reviewMode:'flip'};
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) d = {...d, ...JSON.parse(raw)};
  }catch(e){}
  if(!d.dailyLimit) d.dailyLimit = 20;
  if(!d.reviewMode) d.reviewMode = 'flip';
  return d;
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

let data = loadData();
let screen = {name:"home"};
let manageMode = false;

// ---------- Constantes ----------
const BOX_INTERVALS = [0,1,3,7,16,30];
const MAX_BOX = BOX_INTERVALS.length;
const DECK_COLORS = ["#3B6E71","#8A5A44","#5B5F97","#8C5383","#4C7A3D","#A6763A","#4A6D8C","#96473A"];
const LANG_OPTIONS = [
  {code:'fr-FR', label:'Français'},
  {code:'en-US', label:'Anglais'},
  {code:'es-ES', label:'Espagnol'},
  {code:'de-DE', label:'Allemand'},
  {code:'it-IT', label:'Italien'},
  {code:'pt-PT', label:'Portugais'},
  {code:'ar-SA', label:'Arabe'},
  {code:'zh-CN', label:'Chinois'},
  {code:'ja-JP', label:'Japonais'}
];
function speak(text, lang){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'fr-FR';
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function nextReviewDate(box){ const d=new Date(); d.setDate(d.getDate()+BOX_INTERVALS[Math.min(box,MAX_BOX)-1]); d.setHours(0,0,0,0); return d.toISOString(); }
function isDue(c){ return new Date(c.nextReview).getTime() <= Date.now(); }

// ---------- Helper DOM ----------
function h(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') e.className=v;
    else if(k==='style') Object.assign(e.style,v);
    else if(k.startsWith('on') && typeof v==='function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(v!==undefined && v!==null) e.setAttribute(k,v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c===null||c===undefined) return;
    e.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  });
  return e;
}
const icon = (path, size=18) => {
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("width",size); svg.setAttribute("height",size);
  svg.setAttribute("viewBox","0 0 24 24"); svg.setAttribute("fill","none");
  svg.setAttribute("stroke","currentColor"); svg.setAttribute("stroke-width","2");
  svg.setAttribute("stroke-linecap","round"); svg.setAttribute("stroke-linejoin","round");
  svg.innerHTML = path;
  return svg;
};
const ICONS = {
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  pencil:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  shuffle:'<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',
  sparkle:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  volume:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
  chart:'<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'
};

// ---------- Import de fichier (CSV / Excel) ----------
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ',' || c === ';'){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* ignore */ }
      else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => (v||'').toString().trim().length>0));
}
function rowsToCards(rows, deckId){
  if(!rows || rows.length===0) return [];
  const header = rows[0];
  const dataRows = rows.slice(1);
  const cards = [];
  dataRows.forEach(r=>{
    const recto = (r[0]||'').toString().trim();
    if(!recto) return;
    const colCount = r.filter((v,i)=> i>0 && (v||'').toString().trim().length>0).length;
    if(colCount<=1){
      cards.push({id:uid(), deckId, recto, versoMode:'simple', versoText:(r[1]||'').toString().trim(), versoFields:[], box:1, nextReview:nextReviewDate(1)});
    } else {
      const fields = [];
      for(let i=1;i<r.length;i++){
        const val = (r[i]||'').toString().trim();
        if(val) fields.push({id:uid(), label:(header[i]||'').toString().trim(), value:val});
      }
      cards.push({id:uid(), deckId, recto, versoMode:'fields', versoText:'', versoFields:fields, box:1, nextReview:nextReviewDate(1)});
    }
  });
  return cards;
}
function normWord(s){ return (s||'').toString().trim(); }
function dedupeCards(candidateCards, deckId){
  const existing = new Set(data.cards.filter(c=>c.deckId===deckId).map(c=>normWord(c.recto)));
  const kept = [];
  let skipped = 0;
  candidateCards.forEach(c=>{
    const key = normWord(c.recto);
    if(existing.has(key)){ skipped++; return; }
    existing.add(key);
    kept.push(c);
  });
  return {kept, skipped};
}
function importFileToDeck(file, deckId, onDone){
  const name = file.name.toLowerCase();
  const reader = new FileReader();
  if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
        const candidates = rowsToCards(rows, deckId);
        const {kept, skipped} = dedupeCards(candidates, deckId);
        data.cards = data.cards.concat(kept);
        saveData();
        onDone(kept.length, null, skipped);
      }catch(err){ onDone(0, err); }
    };
    reader.onerror = ()=>onDone(0, true);
    reader.readAsArrayBuffer(file);
  } else {
    reader.onload = (e)=>{
      try{
        const rows = parseCSV(e.target.result);
        const candidates = rowsToCards(rows, deckId);
        const {kept, skipped} = dedupeCards(candidates, deckId);
        data.cards = data.cards.concat(kept);
        saveData();
        onDone(kept.length, null, skipped);
      }catch(err){ onDone(0, err); }
    };
    reader.onerror = ()=>onDone(0, true);
    reader.readAsText(file, 'UTF-8');
  }
}

// ---------- Actions ----------
function addDeck(name, lang, parentId){
  data.decks.push({id:uid(), name, colorIdx:data.decks.length%DECK_COLORS.length, lang: lang || 'fr-FR', parentId: parentId || null, createdAt:Date.now()});
  saveData(); render();
}
function renameDeck(id,name){ const d=data.decks.find(x=>x.id===id); if(d) d.name=name; saveData(); render(); }
function getDescendantDeckIds(deckId){
  const ids = [deckId];
  const stack = [deckId];
  while(stack.length){
    const cur = stack.pop();
    data.decks.filter(d=>d.parentId===cur).forEach(child=>{ ids.push(child.id); stack.push(child.id); });
  }
  return ids;
}
function cardsForDeck(deckId){
  const ids = getDescendantDeckIds(deckId);
  return data.cards.filter(c=>ids.includes(c.deckId));
}
function deleteDeck(id){
  const ids = getDescendantDeckIds(id);
  data.decks = data.decks.filter(x=>!ids.includes(x.id));
  data.cards = data.cards.filter(c=>!ids.includes(c.deckId));
  saveData(); render();
}
function upsertCard(card){
  const i = data.cards.findIndex(c=>c.id===card.id);
  if(i>=0) data.cards[i]=card; else data.cards.push(card);
  saveData();
}
function deleteCard(id){ data.cards=data.cards.filter(c=>c.id!==id); saveData(); render(); }
function answerCard(id, known){
  const c = data.cards.find(x=>x.id===id);
  if(!c) return;
  c.box = known ? Math.min(c.box+1, MAX_BOX) : 1;
  c.nextReview = nextReviewDate(c.box);
  saveData();
}
function dueCount(pool){
  const raw = pool.filter(isDue).length;
  return data.dailyLimit ? Math.min(raw, data.dailyLimit) : raw;
}
function buildModes(queue){
  return queue.map(()=> data.reviewMode==='mixed' ? (Math.random()<0.5?'flip':'write') : data.reviewMode);
}
function startReview(deckId){
  const pool = deckId==='all' ? data.cards : cardsForDeck(deckId);
  if(pool.length===0) return;
  let due = shuffle(pool.filter(isDue));
  due.sort((a,b)=> new Date(a.nextReview) - new Date(b.nextReview));
  if(data.dailyLimit && due.length > data.dailyLimit) due = due.slice(0, data.dailyLimit);
  const queue = shuffle(due.length>0?due:pool);
  screen = {name:"review", queue, modes:buildModes(queue), index:0, showBack:false, correct:0, total:queue.length, reviewedAllAnyway:due.length===0, deckId};
  render();
}
function openDailyLimitPrompt(){
  const current = data.dailyLimit || 20;
  const val = window.prompt("Combien de cartes au maximum veux-tu réviser par session ? (0 = illimité)", String(current));
  if(val===null) return;
  const n = parseInt(val,10);
  if(!isNaN(n) && n>=0){ data.dailyLimit = n===0 ? null : n; saveData(); render(); }
}
function startReviewWeak(deckId){
  const pool = deckId==='all' ? data.cards : cardsForDeck(deckId);
  const weak = pool.filter(c=>c.box===1);
  if(weak.length===0) return;
  const queue = shuffle(weak);
  screen = {name:"review", queue, modes:buildModes(queue), index:0, showBack:false, correct:0, total:queue.length, reviewedAllAnyway:false, deckId};
  render();
}
function confirmDeleteDeck(deck){
  const hasChildren = data.decks.some(d=>d.parentId===deck.id);
  const msg = hasChildren
    ? `Supprimer le dossier "${deck.name}", tous ses sous-dossiers et toutes leurs cartes ? Cette action est définitive.`
    : `Supprimer le dossier "${deck.name}" et toutes ses cartes ? Cette action est définitive.`;
  if(window.confirm(msg)) deleteDeck(deck.id);
}
function confirmDeleteCard(card){
  if(window.confirm("Supprimer cette carte ? Cette action est définitive.")) deleteCard(card.id);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function exportBackup(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mes-fiches-sauvegarde-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
  data.lastExportAt = Date.now();
  saveData();
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ window.alert("Ce fichier n'est pas une sauvegarde valide."); return; }
    if(!parsed || !Array.isArray(parsed.decks) || !Array.isArray(parsed.cards)){
      window.alert("Ce fichier ne semble pas être une sauvegarde de Mes fiches.");
      return;
    }
    if(!window.confirm("Restaurer cette sauvegarde remplacera toutes tes fiches actuelles sur cet appareil. Continuer ?")) return;
    data = {decks:parsed.decks, cards:parsed.cards, dailyLimit: parsed.dailyLimit || 20};
    saveData();
    screen = {name:'home'};
    render();
    window.alert("Sauvegarde restaurée !");
  };
  reader.readAsText(file, 'UTF-8');
}

function deckTile(deck){
  const deckCards = cardsForDeck(deck.id);
  const dueN = dueCount(deckCards);
  const childCount = data.decks.filter(d=>d.parentId===deck.id).length;
  const color = DECK_COLORS[deck.colorIdx%DECK_COLORS.length];
  const tile = h('div',{class:'deck-tile', style:{borderLeft:`6px solid ${color}`}});
  if(!manageMode) tile.onclick = ()=>{ screen={name:'deck',deckId:deck.id}; render(); };
  const subLabel = childCount>0 ? `${childCount} sous-dossier${childCount>1?'s':''} · ` : '';
  const info = h('div',{style:{flex:'1',minWidth:'0'}},[
    h('div',{class:'display',style:{fontSize:'17px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, deck.name),
    h('div',{class:'small'}, subLabel + `${deckCards.length} carte${deckCards.length!==1?'s':''}` + (dueN>0?` · ${dueN} à revoir`:(deckCards.length>0?' · à jour':'')))
  ]);
  tile.appendChild(info);
  if(manageMode){
    const btns = h('div',{style:{display:'flex',gap:'4px',alignItems:'center'}});
    const langSelect = h('select',{style:{fontSize:'11px',color:'var(--muted)',maxWidth:'88px'}});
    LANG_OPTIONS.forEach(opt=>{
      const o = h('option',{value:opt.code}, opt.label);
      if((deck.lang||'fr-FR')===opt.code) o.setAttribute('selected','selected');
      langSelect.appendChild(o);
    });
    langSelect.onclick = (e)=>e.stopPropagation();
    langSelect.onchange = ()=>{ deck.lang = langSelect.value; saveData(); };
    btns.appendChild(langSelect);
    btns.appendChild(h('button',{class:'icon-btn',style:{color:'var(--muted)'}, onclick:(e)=>{e.stopPropagation(); openRenameDeck(deck);}}, icon(ICONS.pencil,16)));
    btns.appendChild(h('button',{class:'icon-btn',style:{color:'var(--red)'}, onclick:(e)=>{e.stopPropagation(); confirmDeleteDeck(deck);}}, icon(ICONS.trash,16)));
    tile.appendChild(btns);
  } else if(dueN>0){
    tile.appendChild(h('div',{style:{fontSize:'11px',borderRadius:'999px',padding:'4px 8px',background:color,color:'white'}}, String(dueN)));
  }
  return tile;
}

// ---------- Écrans ----------
function screenHome(){
  const wrap = h('div');
  const topDecks = data.decks.filter(d=>!d.parentId);
  const headRow = h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'4px'}},[
    h('h1',{class:'display',style:{fontSize:'30px',margin:0}},'Mes fiches'),
    h('div',{style:{display:'flex',gap:'6px',alignItems:'center'}},[
      data.cards.length ? h('button',{class:'icon-btn',style:{color:'var(--muted)'}, onclick:()=>{screen={name:'stats'}; render();}}, icon(ICONS.chart,20)) : null,
      h('button',{class:'icon-btn',style:{color:'var(--muted)'}, onclick:()=>{screen={name:'settings'}; render();}}, icon(ICONS.settings,20)),
      topDecks.length ? h('button',{style:{fontSize:'14px',color:'var(--muted)',marginLeft:'2px'}, onclick:()=>{manageMode=!manageMode; render();}}, manageMode?'Terminé':'Gérer') : null
    ])
  ]);
  wrap.appendChild(headRow);
  const total = data.cards.length;
  const rawDue = data.cards.filter(isDue).length;
  const shownDue = dueCount(data.cards);
  const dueLabel = data.dailyLimit && rawDue > data.dailyLimit
    ? `${shownDue} à revoir aujourd'hui (+${rawDue - shownDue} en réserve)`
    : `${shownDue} à revoir aujourd'hui`;
  wrap.appendChild(h('p',{class:'small',style:{marginBottom:'24px'}}, total===0?"Créez un dossier pour commencer.":`${total} carte${total>1?'s':''} · ${dueLabel}`));

  if(total>0){
    const daysSinceExport = data.lastExportAt ? Math.floor((Date.now()-data.lastExportAt)/86400000) : null;
    if(daysSinceExport===null || daysSinceExport>=3){
      const reminderText = daysSinceExport===null ? "Tu n'as jamais exporté de sauvegarde." : `Dernière sauvegarde il y a ${daysSinceExport} jour${daysSinceExport>1?'s':''}.`;
      wrap.appendChild(h('div',{style:{background:'#F6EBD8',border:'1px solid var(--red)',borderRadius:'12px',padding:'12px 14px',marginBottom:'20px',display:'flex',alignItems:'center',gap:'10px'}},[
        h('div',{style:{flex:'1',fontSize:'13px',color:'var(--ink)'}}, reminderText + " Pense à exporter (Réglages ⚙) pour ne rien perdre."),
        h('button',{style:{fontSize:'13px',color:'var(--red)',fontWeight:'600',whiteSpace:'nowrap'}, onclick:exportBackup}, 'Exporter')
      ]));
    }
  }

  if(total>0){
    wrap.appendChild(h('button',{class:'btn-primary',style:{marginBottom:'24px',justifyContent:'space-between'}, onclick:()=>startReview('all')},[
      h('span',{style:{display:'flex',alignItems:'center',gap:'8px'}},[icon(ICONS.shuffle,18), h('span',{class:'display',style:{fontSize:'18px'}},'Grand test mélangé')]),
      h('span',{style:{fontSize:'11px',opacity:'0.7'}},'tous les dossiers')
    ]));
  }

  const list = h('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}});
  topDecks.forEach(deck=> list.appendChild(deckTile(deck)));
  wrap.appendChild(list);

  if(topDecks.length===0){
    wrap.appendChild(h('div',{style:{border:'1px dashed var(--muted)',borderRadius:'12px',padding:'24px',textAlign:'center',color:'var(--muted)',marginTop:'8px'}}, "Aucun dossier pour l'instant. Créez-en un pour ranger vos premières fiches."));
  }

function openRenameDeck(deck){

function screenDeck(deckId){
  const deck = data.decks.find(d=>d.id===deckId);
  if(!deck){ screen={name:'home'}; return screenHome(); }
  const color = DECK_COLORS[deck.colorIdx%DECK_COLORS.length];
  const children = data.decks.filter(d=>d.parentId===deckId);
  const directCards = data.cards.filter(c=>c.deckId===deckId);
  const allCards = cardsForDeck(deckId);
  const due = dueCount(allCards);
  const notKnown = allCards.filter(c=>c.box===1).length;
  const backTarget = deck.parentId ? {name:'deck', deckId: deck.parentId} : {name:'home'};

  const wrap = h('div');
  const headerRow = h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}},[
    h('button',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'14px',color:'var(--muted)'}, onclick:()=>{manageMode=false; screen=backTarget; render();}},[icon(ICONS.back,16), deck.parentId ? 'Retour' : 'Dossiers']),
    children.length ? h('button',{style:{fontSize:'14px',color:'var(--muted)'}, onclick:()=>{manageMode=!manageMode; render();}}, manageMode?'Terminé':'Gérer') : null
  ]);
  wrap.appendChild(headerRow);
  wrap.appendChild(h('h1',{class:'display',style:{fontSize:'24px',color,margin:'0 0 4px'}}, deck.name));
  wrap.appendChild(h('p',{class:'small',style:{marginBottom:'20px'}}, `${allCards.length} carte${allCards.length!==1?'s':''}` + (notKnown>0?` · ${notKnown} pas encore sues`:'')));

  if(allCards.length>0){
    wrap.appendChild(h('button',{class:'btn-primary',style:{background:color,marginBottom:'10px'}, onclick:()=>startReview(deckId)},
      h('span',{class:'display',style:{fontSize:'18px'}}, due>0?`Réviser (${due})`:'Tout revoir')));
    if(notKnown>0){
      wrap.appendChild(h('button',{class:'btn-outline',style:{marginBottom:'20px',borderColor:'var(--red)',color:'var(--red)'}, onclick:()=>startReviewWeak(deckId)},
        `Réviser les mots pas encore sus (${notKnown})`));
    }
  }

  if(children.length>0){
    wrap.appendChild(h('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.05em',color:'var(--muted)',marginBottom:'8px'}}, 'Sous-dossiers'));
    const subList = h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'20px'}});
    children.forEach(child=> subList.appendChild(deckTile(child)));
    wrap.appendChild(subList);
  }

  const addSubZone = h('div',{style:{marginBottom:'20px'}});
  addSubZone.appendChild(h('button',{class:'btn-outline', onclick:()=>openNewDeckForm(addSubZone, deckId)},[icon(ICONS.plus,18),'Nouveau sous-dossier']));
  wrap.appendChild(addSubZone);

  if(directCards.length>0 || children.length===0){
    wrap.appendChild(h('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.05em',color:'var(--muted)',marginBottom:'8px'}}, 'Cartes dans ce dossier'));
  }
  const list = h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'16px'}});
  directCards.forEach(card=>{
    const row = h('div',{class:'card-row'});
    row.appendChild(h('div',{class:'mono',style:{flex:'1',minWidth:'0',fontSize:'14px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, card.recto));
    const dotColor = card.box===1 ? 'var(--red)' : (card.box>=MAX_BOX ? color : 'var(--muted)');
    row.appendChild(h('div',{class:'dot',style:{background:dotColor}}));
    row.appendChild(h('button',{class:'icon-btn',style:{color:'var(--muted)'}, onclick:()=>{screen={name:'cardForm',deckId,cardId:card.id}; render();}}, icon(ICONS.pencil,15)));
    row.appendChild(h('button',{class:'icon-btn',style:{color:'var(--red)'}, onclick:()=>confirmDeleteCard(card)}, icon(ICONS.trash,15)));
    list.appendChild(row);
  });
  wrap.appendChild(list);

  if(directCards.length===0 && children.length===0){
    wrap.appendChild(h('div',{style:{border:'1px dashed var(--muted)',borderRadius:'12px',padding:'24px',textAlign:'center',color:'var(--muted)',marginBottom:'16px'}}, 'Ce dossier est vide. Ajoutez une carte ou un sous-dossier.'));
  }

  wrap.appendChild(h('button',{class:'btn-outline', onclick:()=>{screen={name:'cardForm',deckId,cardId:null}; render();}},[icon(ICONS.plus,18),'Nouvelle carte']));

  const importInput = h('input',{type:'file', accept:'.csv,.xlsx,.xls,.txt', style:{display:'none'}});
  importInput.onchange = ()=>{
    const file = importInput.files[0];
    if(!file) return;
    importFileToDeck(file, deckId, (count, err, skipped)=>{
      if(err){ window.alert("Le fichier n'a pas pu être lu. Vérifie qu'il s'agit bien d'un fichier CSV ou Excel, avec une 1ère ligne de titres."); return; }
      screen = {name:'deck', deckId};
      render();
      let msg = count>0 ? `${count} carte${count>1?'s':''} importée${count>1?'s':''} !` : "Aucune nouvelle carte importée.";
      if(skipped>0) msg += ` (${skipped} déjà présente${skipped>1?'s':''} dans ce dossier, ignorée${skipped>1?'s':''})`;
      window.alert(msg);
    });
  };
  wrap.appendChild(importInput);
  wrap.appendChild(h('button',{class:'btn-outline', style:{marginTop:'8px'}, onclick:()=>importInput.click()},[icon(ICONS.upload,18),'Importer un fichier (Excel/CSV)']));
  wrap.appendChild(h('div',{class:'small',style:{textAlign:'center',marginTop:'8px'}}, "Colonne A = recto, colonnes suivantes = verso (1 pour une définition simple, plusieurs pour des champs). 1ère ligne = titres. L'import se fait directement dans ce dossier (pas dans les sous-dossiers)."));
  return wrap;
}

function screenCardForm(deckId, cardId){
  const existing = cardId ? data.cards.find(c=>c.id===cardId) : null;
  let versoMode = existing?.versoMode || 'simple';
  let versoFields = existing?.versoFields?.length ? existing.versoFields.map(f=>({...f})) : [{id:uid(),label:'',value:''}];

  const wrap = h('div');
  const head = h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px'}},[
    h('button',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'14px',color:'var(--muted)'}, onclick:()=>{screen={name:'deck',deckId}; render();}},[icon(ICONS.back,16),'Annuler']),
    h('h1',{class:'display',style:{fontSize:'17px',margin:0}}, existing?'Modifier la carte':'Nouvelle carte'),
    h('div',{style:{width:'60px'}})
  ]);
  wrap.appendChild(head);

  wrap.appendChild(h('label',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.05em',color:'var(--muted)'}}, 'Recto'));
  const rectoInput = h('textarea',{rows:2, placeholder:'Question, mot, terme…', class:'mono', style:{fontSize:'14px',background:'white',borderRadius:'10px',padding:'12px',marginTop:'4px',marginBottom:'16px',display:'block'}});
  rectoInput.value = existing?.recto || '';
  wrap.appendChild(rectoInput);

  const toggleRow = h('div',{style:{display:'flex',gap:'8px',marginBottom:'12px'}});
  const btnSimple = h('button',{class:'toggle'}, 'Définition simple');
  const btnFields = h('button',{class:'toggle'}, 'Champs multiples');
  toggleRow.appendChild(btnSimple); toggleRow.appendChild(btnFields);
  wrap.appendChild(toggleRow);

  const versoZone = h('div',{style:{marginBottom:'8px'}});
  wrap.appendChild(versoZone);

  const simpleTextarea = h('textarea',{rows:3, placeholder:'Réponse, définition, traduction…', class:'mono', style:{fontSize:'14px',background:'white',borderRadius:'10px',padding:'12px',display:'block'}});
  simpleTextarea.value = existing?.versoText || '';

  function renderVersoZone(){
    versoZone.innerHTML='';
    btnSimple.style.background = versoMode==='simple' ? 'var(--ink)' : 'white';
    btnSimple.style.color = versoMode==='simple' ? 'var(--paper)' : 'var(--ink)';
    btnFields.style.background = versoMode==='fields' ? 'var(--ink)' : 'white';
    btnFields.style.color = versoMode==='fields' ? 'var(--paper)' : 'var(--ink)';
    if(versoMode==='simple'){
      versoZone.appendChild(simpleTextarea);
    } else {
      const fieldsWrap = h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});
      versoFields.forEach(f=>{
        const labelInput = h('input',{placeholder:'Nom du champ (ex : Définition, Exemple…)', style:{fontSize:'12px',color:'var(--muted)'}});
        labelInput.value = f.label;
        labelInput.oninput = ()=>{ f.label = labelInput.value; };
        const valueInput = h('textarea',{rows:1, placeholder:'Contenu', class:'mono', style:{fontSize:'14px'}});
        valueInput.value = f.value;
        valueInput.oninput = ()=>{ f.value = valueInput.value; };
        const box = h('div',{class:'field-box'},[
          h('div',{style:{flex:'1',display:'flex',flexDirection:'column',gap:'4px'}},[labelInput, valueInput]),
          h('button',{class:'icon-btn',style:{color:'var(--red)'}, onclick:()=>{ if(versoFields.length>1){ versoFields = versoFields.filter(x=>x.id!==f.id); renderVersoZone(); } }}, icon(ICONS.x,15))
        ]);
        fieldsWrap.appendChild(box);
      });
      versoZone.appendChild(fieldsWrap);
      versoZone.appendChild(h('button',{class:'btn-outline',style:{marginTop:'8px',fontSize:'14px',padding:'10px'}, onclick:()=>{ versoFields.push({id:uid(),label:'',value:''}); renderVersoZone(); }},[icon(ICONS.plus,14),'Ajouter un champ']));
    }
  }
  btnSimple.onclick = ()=>{ versoMode='simple'; renderVersoZone(); };
  btnFields.onclick = ()=>{ versoMode='fields'; renderVersoZone(); };
  renderVersoZone();

  const saveBtn = h('button',{class:'btn-primary', style:{marginTop:'24px'}}, 'Enregistrer');
  saveBtn.onclick = ()=>{
    const recto = rectoInput.value.trim();
    const ok = recto.length>0 && (versoMode==='simple' ? simpleTextarea.value.trim().length>0 : versoFields.some(f=>f.value.trim().length>0));
    if(!ok) return;
    const card = {
      id: existing?.id || uid(),
      deckId,
      recto,
      versoMode,
      versoText: versoMode==='simple' ? simpleTextarea.value.trim() : '',
      versoFields: versoMode==='fields' ? versoFields.filter(f=>f.value.trim().length>0).map(f=>({...f,label:f.label.trim()})) : [],
      box: existing?.box || 1,
      nextReview: existing?.nextReview || nextReviewDate(1)
    };
    upsertCard(card);
    screen = {name:'deck', deckId};
    render();
  };
  wrap.appendChild(saveBtn);
  return wrap;
}

function screenReview(){
  const {queue, index, total, deckId, reviewedAllAnyway} = screen;
  const card = queue[index];
  if(!card) return h('div');
  const mode = screen.modes ? (screen.modes[index] || 'flip') : 'flip';
  const deck = data.decks.find(d=>d.id===card.deckId);
  const color = deck ? DECK_COLORS[deck.colorIdx%DECK_COLORS.length] : 'var(--ink)';
  const deckLang = deck ? (deck.lang || 'fr-FR') : 'fr-FR';

  const wrap = h('div',{style:{display:'flex',flexDirection:'column',minHeight:'calc(100vh - 64px)'}});
  wrap.appendChild(h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'24px'}},[
    h('button',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'14px',color:'var(--muted)'}, onclick:()=>{ screen = deckId==='all' ? {name:'home'} : {name:'deck',deckId}; render(); }},[icon(ICONS.back,16),'Quitter']),
    h('div',{class:'mono small'}, `${index+1} / ${total}`)
  ]));

  if(reviewedAllAnyway && index===0){
    wrap.appendChild(h('div',{class:'small',style:{textAlign:'center',marginBottom:'16px'}}, "Rien n'est dû aujourd'hui — revue libre de toutes les cartes."));
  }

  if(mode==='write'){
    wrap.appendChild(renderWriteCard(card, color, deckLang));
  } else {
    wrap.appendChild(renderFlipCard(card, color, deckLang));
  }
  return wrap;
}

function renderFlipCard(card, color, deckLang){
  const container = h('div',{style:{display:'flex',flexDirection:'column',flex:'1'}});
  const flipOuter = h('div',{class:'flip-outer'});
  const flipInner = h('div',{class:'flip-inner'});
  flipInner.onclick = ()=>{ flipInner.classList.toggle('flipped'); screen.showBack = flipInner.classList.contains('flipped'); renderAnswerZone(); };

  const front = h('div',{class:'face face-front'},[
    h('div',{class:'rule'}),
    h('button',{class:'icon-btn', style:{position:'absolute',top:'10px',right:'10px',color:'var(--muted)'}, onclick:(e)=>{ e.stopPropagation(); speak(card.recto, deckLang); }}, icon(ICONS.volume,18)),
    h('div',{class:'display',style:{flex:'1',display:'flex',alignItems:'center',justifyContent:'center',textAlign:'center',fontSize:'22px'}}, card.recto),
    h('div',{class:'small',style:{textAlign:'center'}}, 'touchez pour retourner')
  ]);
  const versoSpokenText = card.versoMode==='simple' ? card.versoText : card.versoFields.map(f=>f.value).join(', ');
  const back = h('div',{class:'face face-back',style:{border:`2px solid ${color}`}});
  back.appendChild(h('button',{class:'icon-btn', style:{position:'absolute',top:'10px',right:'10px',color:'var(--muted)'}, onclick:(e)=>{ e.stopPropagation(); speak(versoSpokenText, deckLang); }}, icon(ICONS.volume,18)));
  if(card.versoMode==='simple'){
    back.appendChild(h('div',{class:'mono',style:{flex:'1',display:'flex',alignItems:'center',justifyContent:'center',textAlign:'center',fontSize:'15px'}}, card.versoText));
  } else {
    const fw = h('div',{style:{flex:'1',display:'flex',flexDirection:'column',justifyContent:'center',gap:'12px'}});
    card.versoFields.forEach(f=>{
      const item = h('div');
      if(f.label) item.appendChild(h('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.05em',color}}, f.label));
      item.appendChild(h('div',{class:'mono',style:{fontSize:'14px'}}, f.value));
      fw.appendChild(item);
    });
    back.appendChild(fw);
  }
  flipInner.appendChild(front); flipInner.appendChild(back);
  flipOuter.appendChild(flipInner);
  speak(card.recto, deckLang);

  const cardHolder = h('div',{style:{flex:'1',display:'flex',alignItems:'center',justifyContent:'center'}}, flipOuter);
  container.appendChild(cardHolder);

  const answerZone = h('div',{style:{marginTop:'24px'}});
  function renderAnswerZone(){
    answerZone.innerHTML='';
    if(screen.showBack){
      const row = h('div',{style:{display:'flex',gap:'12px'}});
      const btnNo = h('button',{class:'btn-primary',style:{background:'var(--red)',flex:'1'}},[icon(ICONS.x,18),'Pas su']);
      const btnYes = h('button',{class:'btn-primary',style:{background:'var(--green)',flex:'1'}},[icon(ICONS.check,18),'Su']);
      btnNo.onclick = ()=>answer(false);
      btnYes.onclick = ()=>answer(true);
      row.appendChild(btnNo); row.appendChild(btnYes);
      answerZone.appendChild(row);
    } else {
      answerZone.appendChild(h('button',{class:'btn-primary', onclick:()=>{ flipInner.classList.add('flipped'); screen.showBack=true; renderAnswerZone(); }}, 'Retourner la carte'));
    }
  }
  renderAnswerZone();
  container.appendChild(answerZone);
  return container;
}

function normalizeForCompare(s){
  return (s||'').toString().trim().replace(/\s+/g,' ');
}

function renderWriteCard(card, color, deckLang){
  const container = h('div',{style:{display:'flex',flexDirection:'column',flex:'1'}});
  const promptCard = h('div',{style:{background:'white',borderRadius:'18px',padding:'24px',marginBottom:'20px',border:`2px solid ${color}`}});
  promptCard.appendChild(h('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.05em',color:'var(--muted)',marginBottom:'10px',textAlign:'center'}}, 'Écris le mot correspondant à :'));
  if(card.versoMode==='simple'){
    promptCard.appendChild(h('div',{class:'mono',style:{textAlign:'center',fontSize:'16px'}}, card.versoText));
  } else {
    const fw = h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}});
    card.versoFields.forEach(f=>{
      const item = h('div',{style:{textAlign:'center'}});
      if(f.label) item.appendChild(h('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.05em',color}}, f.label));
      item.appendChild(h('div',{class:'mono',style:{fontSize:'14px'}}, f.value));
      fw.appendChild(item);
    });
    promptCard.appendChild(fw);
  }
  container.appendChild(promptCard);

  const resultZone = h('div',{style:{marginBottom:'16px'}});
  container.appendChild(resultZone);

  const inputWrap = h('div',{style:{marginBottom:'16px'}});
  const input = h('input',{class:'mono', style:{fontSize:'20px',textAlign:'center',background:'white',borderRadius:'12px',padding:'16px',display:'block',direction:'rtl'}, placeholder:'اكتب هنا...'});
  input.setAttribute('autocapitalize','off');
  input.setAttribute('autocorrect','off');
  input.setAttribute('spellcheck','false');
  inputWrap.appendChild(input);
  container.appendChild(inputWrap);

  const actionZone = h('div',{style:{marginTop:'auto'}});
  container.appendChild(actionZone);

  function renderCheckButton(){
    actionZone.innerHTML='';
    const btn = h('button',{class:'btn-primary', onclick:checkAnswer}, 'Vérifier');
    actionZone.appendChild(btn);
  }
  function checkAnswer(){
    const isCorrect = normalizeForCompare(input.value)===normalizeForCompare(card.recto);
    resultZone.innerHTML='';
    input.setAttribute('disabled','disabled');
    resultZone.appendChild(h('div',{style:{textAlign:'center',padding:'14px',borderRadius:'12px',background: isCorrect?'#E4F0E3':'#F6E4E2',color: isCorrect?'var(--green)':'var(--red)',fontWeight:'600',marginBottom:'8px'}}, isCorrect ? 'Correct !' : 'Pas tout à fait...'));
    if(!isCorrect){
      resultZone.appendChild(h('div',{style:{textAlign:'center'}},[
        h('div',{class:'small',style:{marginBottom:'4px'}}, 'Bonne orthographe :'),
        h('div',{class:'mono',style:{fontSize:'20px'}}, card.recto)
      ]));
    }
    actionZone.innerHTML='';
    const btn = h('button',{class:'btn-primary', style:{background: isCorrect?'var(--green)':'var(--red)'}, onclick:()=>answer(isCorrect)}, 'Continuer');
    actionZone.appendChild(btn);
  }
  renderCheckButton();
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); if(!input.hasAttribute('disabled')) checkAnswer(); } });
  return container;
}

function answer(known){
  const {queue, index, total, correct, deckId} = screen;
  const card = queue[index];
  answerCard(card.id, known);
  const newCorrect = correct + (known?1:0);
  if(index+1 < queue.length){
    screen = {...screen, index: index+1, showBack:false, correct:newCorrect};
  } else {
    screen = {name:'reviewSummary', correct:newCorrect, total, deckId};
  }
  render();
}

function screenSummary(){
  const {correct, total, deckId} = screen;
  const pct = total>0 ? Math.round((correct/total)*100) : 0;
  const wrap = h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',textAlign:'center',paddingTop:'48px'}});

  const col = h('div',{style:{width:'100%',display:'flex',flexDirection:'column',gap:'12px'}});
  if(deckId!=='all'){
    col.appendChild(h('button',{class:'btn-primary', onclick:()=>{screen={name:'deck',deckId}; render();}}, 'Retour au dossier'));
  }
  col.appendChild(h('button',{class:'btn-outline', onclick:()=>{screen={name:'home'}; render();}}, 'Accueil'));
  wrap.appendChild(col);
  return wrap;
}

  wrap.appendChild(h('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.05em',color:'var(--muted)',marginBottom:'8px'}}, 'Sauvegarde'));
  wrap.appendChild(h('p',{class:'small',style:{marginBottom:'12px'}}, "Tes fiches ne sont stockées que sur cet appareil. Exporte une sauvegarde régulièrement pour ne rien perdre, ou pour les transférer sur un autre appareil."));
  wrap.appendChild(h('button',{class:'btn-outline',style:{marginBottom:'10px'}, onclick:exportBackup},[icon(ICONS.download,18),'Exporter mes fiches (.json)']));

  const importInput = h('input',{type:'file', accept:'.json', style:{display:'none'}});
  importInput.onchange = ()=>{ const f = importInput.files[0]; if(f) importBackupFile(f); };
  wrap.appendChild(importInput);
  wrap.appendChild(h('button',{class:'btn-outline', onclick:()=>importInput.click()},[icon(ICONS.upload,18),'Importer une sauvegarde']));

  return wrap;
}

function screenStats(){
  const wrap = h('div');
  wrap.appendChild(h('button',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'14px',color:'var(--muted)',marginBottom:'16px'}, onclick:()=>{screen={name:'home'}; render();}},[icon(ICONS.back,16),'Accueil']));
  wrap.appendChild(h('h1',{class:'display',style:{fontSize:'24px',margin:'0 0 20px'}}, 'Statistiques'));

  const total = data.cards.length;
  if(total===0){
    wrap.appendChild(h('div',{class:'small'}, "Pas encore de cartes à analyser."));
    return wrap;
  }
  const mastered = data.cards.filter(c=>c.box>=MAX_BOX).length;
  const notKnown = data.cards.filter(c=>c.box===1).length;
  const inProgress = total - mastered - notKnown;

  const summaryRow = h('div',{style:{display:'flex',gap:'8px',marginBottom:'24px'}});
  const statBox = (label, value, col) => h('div',{class:'card-row',style:{flex:'1',flexDirection:'column',alignItems:'flex-start',gap:'2px'}},[
    h('div',{class:'display',style:{fontSize:'22px',color:col}}, String(value)),
    h('div',{class:'small'}, label)
  ]);
  summaryRow.appendChild(statBox('maîtrisées', mastered, 'var(--green)'));
  summaryRow.appendChild(statBox('en cours', inProgress, 'var(--ink)'));
  summaryRow.appendChild(statBox('pas sues', notKnown, 'var(--red)'));
  wrap.appendChild(summaryRow);

  wrap.appendChild(h('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.05em',color:'var(--muted)',marginBottom:'10px'}}, 'Répartition par case (1 = jamais sue, 6 = maîtrisée)'));
  const barsWrap = h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'28px'}});
  for(let box=1; box<=MAX_BOX; box++){
    const n = data.cards.filter(c=>c.box===box).length;
    const pct = total>0 ? Math.round((n/total)*100) : 0;
    const col = box===1 ? 'var(--red)' : (box>=MAX_BOX ? 'var(--green)' : 'var(--muted)');
    barsWrap.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},[
      h('div',{class:'mono small',style:{width:'16px'}}, String(box)),
      h('div',{style:{flex:'1',background:'white',borderRadius:'6px',height:'18px',overflow:'hidden'}},
        h('div',{style:{width:pct+'%',height:'100%',background:col}})
      ),
      h('div',{class:'small',style:{width:'34px',textAlign:'right'}}, String(n))
    ]));
  }
  wrap.appendChild(barsWrap);

  wrap.appendChild(h('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.05em',color:'var(--muted)',marginBottom:'10px'}}, 'Par dossier'));
  const deckList = h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});
  data.decks.forEach(deck=>{
    const dc = data.cards.filter(c=>c.deckId===deck.id);
    const dm = dc.filter(c=>c.box>=MAX_BOX).length;
    const color = DECK_COLORS[deck.colorIdx%DECK_COLORS.length];
    deckList.appendChild(h('div',{class:'card-row'},[
      h('div',{style:{flex:'1',fontSize:'14px'}}, deck.name),
      h('div',{class:'small'}, `${dm} / ${dc.length} maîtrisées`)
    ]));
  });
  wrap.appendChild(deckList);
  return wrap;
}

// ---------- Rendu principal ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML='';
  let node;
  if(screen.name==='home') node = screenHome();
  else if(screen.name==='deck') node = screenDeck(screen.deckId);
  else if(screen.name==='cardForm') node = screenCardForm(screen.deckId, screen.cardId);
  else if(screen.name==='review') node = screenReview();
  else if(screen.name==='reviewSummary') node = screenSummary();
  else if(screen.name==='settings') node = screenSettings();
  else if(screen.name==='stats') node = screenStats();
  else node = screenHome();
  app.appendChild(node);
}
render();
</script>
</body>
</html>
